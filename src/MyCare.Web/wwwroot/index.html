<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyCare Appointments</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="banner">
    <h1>MyCare Appointments</h1>
    <p class="demo-note" data-testid="demo-note">Demo environment &middot; synthetic data only &middot; all times are UTC</p>
  </header>

  <main>
    <section class="card">
      <h2>Book an appointment</h2>
      <form id="booking-form" data-testid="booking-form" novalidate>
        <label>Patient name
          <input id="patientName" data-testid="patient-name" maxlength="100" autocomplete="off" required>
        </label>
        <label>Provider
          <select id="provider" data-testid="provider" required></select>
        </label>
        <label>Start (UTC)
          <input id="start" type="datetime-local" step="900" data-testid="start" required>
        </label>
        <label>Duration
          <select id="duration" data-testid="duration">
            <option value="15">15 min</option>
            <option value="30" selected>30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
            <option value="90">90 min</option>
            <option value="120">120 min</option>
          </select>
        </label>
        <label class="wide">Reason (optional)
          <input id="reason" data-testid="reason" maxlength="250" autocomplete="off">
        </label>
        <button type="submit" data-testid="book-button">Book appointment</button>
      </form>
      <div id="message" class="message" data-testid="message" role="status" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Appointments</h2>
        <label>Filter by provider
          <select id="filter" data-testid="provider-filter">
            <option value="">All providers</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table data-testid="appointments-table">
          <thead>
            <tr><th>Patient</th><th>Provider</th><th>Start</th><th>Duration</th><th>Reason</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" data-testid="empty-state" hidden>No appointments to show.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
